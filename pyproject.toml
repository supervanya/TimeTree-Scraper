[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timetree-sync"
version = "0.1.0"
description = "One-way synchronization from TimeTree to Google Calendar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.180,<3",
    "google-auth-oauthlib>=1.2,<2",
    "icalendar>=6.1,<8",
    "timetree-exporter==0.9.0",
]

[project.scripts]
timetree-sync = "timetree_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/timetree_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
